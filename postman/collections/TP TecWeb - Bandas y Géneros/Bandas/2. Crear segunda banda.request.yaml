$kind: http-request
url: "{{baseUrl}}/bandas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Ghost",
      "pais": "Suecia",
      "anioFormacion": 2006,
      "generoId": {{generoId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', function () {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 2000
