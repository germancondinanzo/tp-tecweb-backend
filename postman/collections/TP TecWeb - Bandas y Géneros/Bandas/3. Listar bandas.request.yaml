$kind: http-request
description: Devuelve 200 con el array de bandas, cada una con su género anidado.
url: "{{baseUrl}}/bandas"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('devuelve un array', function () {
          pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 3000
