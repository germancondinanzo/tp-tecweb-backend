$kind: http-request
description: Usa el {{generoId}} que se guardó en el caso 1.
url: "{{baseUrl}}/generos/{{generoId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('el id coincide con el solicitado', function () {
          pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('generoId')));
      });
    language: text/javascript
order: 4000
