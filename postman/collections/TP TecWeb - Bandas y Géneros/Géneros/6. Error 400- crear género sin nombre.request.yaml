$kind: http-request
name: "6. Error 400: crear género sin nombre"
description: "Falta el campo obligatorio nombre: el ValidationPipe global responde 400."
url: "{{baseUrl}}/generos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 6000
